# SEC-16: dependências e segredos do front-end. O CI completo (lint, testes) chega com FE-04.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # segundas, 03:00 (BRT) — pega CVEs novas mesmo sem commit

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependências e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dependências de produção sem vulnerabilidade alta/crítica
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
