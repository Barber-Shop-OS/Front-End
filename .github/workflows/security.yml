# SEC-16: dependências e segredos do front-end. O CI completo (lint, testes) chega com FE-04.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # segundas, 03:00 (BRT) — pega CVEs novas mesmo sem commit

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependências e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dependências de produção sem vulnerabilidade alta/crítica
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 exige licença paga em repositórios de organização (GITLEAKS_LICENSE).
      # O CLI do gitleaks é MIT e gratuito: baixado com versão fixa e checksum conferido.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tgz
      - name: Varrer o histórico do git
        run: gitleaks git --redact --verbose --exit-code 1 .
